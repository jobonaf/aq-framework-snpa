# Directive (EU) 2024/2881 — Article 4: Definitions
# Normative YAML Annotation — Specification v2.1

- id: Art4_def01
  source:
    document: directive_2024_2881
    article: 4
    point: 1
  norm_type: definition
  normative_role: definitional
  term: ambient_air
  definition: >
    outdoor air in the troposphere, excluding workplaces as defined in
    Article 2 of Council Directive 89/654/EEC where provisions concerning
    health and safety at work apply and to which members of the public do
    not have regular access
  domain:
    - general

- id: Art4_def02
  source:
    document: directive_2024_2881
    article: 4
    point: 2
  norm_type: definition
  normative_role: definitional
  term: air_quality_standards
  definition: >
    limit values, target values, average exposure reduction obligations,
    average exposure concentration objectives, critical levels, alert
    thresholds, information thresholds and long-term objectives
  domain:
    - general
    - assessment

- id: Art4_def03
  source:
    document: directive_2024_2881
    article: 4
    point: 3
  norm_type: definition
  normative_role: definitional
  term: pollutant
  definition: >
    any substance present in ambient air and likely to have harmful effects
    on human health or the environment
  domain:
    - general

- id: Art4_def04
  source:
    document: directive_2024_2881
    article: 4
    point: 4
  norm_type: definition
  normative_role: definitional
  term: level
  definition: >
    the concentration of a pollutant in ambient air or the deposition
    thereof on surfaces in a given time
  domain:
    - general
    - assessment

- id: Art4_def05
  source:
    document: directive_2024_2881
    article: 4
    point: 5
  norm_type: definition
  normative_role: definitional
  term: total_deposition
  definition: >
    the total mass of pollutants which is transferred from the atmosphere
    to surfaces, such as soil, vegetation, water or buildings, in a given
    area within a given time
  domain:
    - general
    - assessment

- id: Art4_def06
  source:
    document: directive_2024_2881
    article: 4
    point: 6
  norm_type: definition
  normative_role: definitional
  term: PM10
  definition: >
    particulate matter which passes through a size-selective inlet as
    defined in the reference method for the sampling and measurement of
    PM10, EN 12341, with a 50 % efficiency cut-off at 10 μm aerodynamic
    diameter
  domain:
    - general
    - monitoring

- id: Art4_def07
  source:
    document: directive_2024_2881
    article: 4
    point: 7
  norm_type: definition
  normative_role: definitional
  term: PM2_5
  definition: >
    particulate matter which passes through a size-selective inlet as
    defined in the reference method for the sampling and measurement of
    PM2.5, EN 12341, with a 50 % efficiency cut-off at 2,5 μm aerodynamic
    diameter
  domain:
    - general
    - monitoring

- id: Art4_def08
  source:
    document: directive_2024_2881
    article: 4
    point: 8
  norm_type: definition
  normative_role: definitional
  term: oxides_of_nitrogen
  definition: >
    the sum of the volume mixing ratio (ppbv) of nitrogen monoxide (nitric
    oxide) and nitrogen dioxide expressed in units of mass concentration of
    nitrogen dioxide (μg/m3)
  domain:
    - general
    - monitoring

- id: Art4_def09
  source:
    document: directive_2024_2881
    article: 4
    point: 9
  norm_type: definition
  normative_role: definitional
  term: arsenic_cadmium_lead_nickel_benzo_a_pyrene
  definition: >
    the total content of these elements and compounds in the PM10 fraction;
    applies to arsenic, cadmium, lead, nickel and benzo(a)pyrene
  domain:
    - general
    - monitoring

- id: Art4_def10
  source:
    document: directive_2024_2881
    article: 4
    point: 10
  norm_type: definition
  normative_role: definitional
  term: polycyclic_aromatic_hydrocarbons
  definition: >
    those organic compounds, composed of at least two fused aromatic rings
    made entirely from carbon and hydrogen
  domain:
    - general
    - monitoring

- id: Art4_def11
  source:
    document: directive_2024_2881
    article: 4
    point: 11
  norm_type: definition
  normative_role: definitional
  term: total_gaseous_mercury
  definition: >
    elemental mercury vapour (Hg0) and reactive gaseous mercury, i.e.
    water-soluble mercury species with sufficiently high vapour pressure to
    exist in the gas phase
  domain:
    - general
    - monitoring

- id: Art4_def12
  source:
    document: directive_2024_2881
    article: 4
    point: 12
  norm_type: definition
  normative_role: definitional
  term: volatile_organic_compounds
  definition: >
    organic compounds from anthropogenic and biogenic sources, other than
    methane, that are capable of producing photochemical oxidants by
    reactions with nitrogen oxides in the presence of sunlight
  domain:
    - general
    - monitoring

- id: Art4_def13
  source:
    document: directive_2024_2881
    article: 4
    point: 13
  norm_type: definition
  normative_role: definitional
  term: ozone_precursor_substances
  definition: >
    substances which contribute to the formation of ground-level ozone
  domain:
    - general
    - monitoring

- id: Art4_def14
  source:
    document: directive_2024_2881
    article: 4
    point: 14
  norm_type: definition
  normative_role: definitional
  term: black_carbon
  definition: >
    carbonaceous aerosols measured by light absorption
  domain:
    - general
    - monitoring

- id: Art4_def15
  source:
    document: directive_2024_2881
    article: 4
    point: 15
  norm_type: definition
  normative_role: definitional
  term: ultrafine_particles
  definition: >
    particles with a diameter less than or equal to 100 nm, where UFP are
    measured as the particle number concentrations per cubic centimetre for
    a size range with a lower limit of 10 nm and for a size range with no
    restriction on the upper limit
  domain:
    - general
    - monitoring

- id: Art4_def16
  source:
    document: directive_2024_2881
    article: 4
    point: 16
  norm_type: definition
  normative_role: definitional
  term: oxidative_potential_of_particulate_matter
  definition: >
    a measure of the capacity of particulate matter to oxidise potential
    target molecules
  domain:
    - general
    - monitoring

- id: Art4_def17
  source:
    document: directive_2024_2881
    article: 4
    point: 17
  norm_type: definition
  normative_role: definitional
  term: zone
  definition: >
    part of the territory of a Member State, as delimited by that Member
    State for the purposes of air quality assessment and management
  domain:
    - general
    - assessment

- id: Art4_def18
  source:
    document: directive_2024_2881
    article: 4
    point: 18
  norm_type: definition
  normative_role: definitional
  term: average_exposure_territorial_unit
  definition: >
    a part of the territory of a Member State designated by that Member
    State for the purposes of determining the average exposure indicator,
    corresponding to a NUTS 1 or NUTS 2 region as set out in Regulation
    (EC) No 1059/2003 or a combination of two or more adjacent NUTS 1 or
    NUTS 2 regions, provided that their total combined size is smaller than
    the entire territory of that Member State and not larger than 85 000 km2
  domain:
    - general
    - assessment

- id: Art4_def19
  source:
    document: directive_2024_2881
    article: 4
    point: 19
  norm_type: definition
  normative_role: definitional
  term: agglomeration
  definition: >
    a conurbation with a population in excess of 250 000 inhabitants or,
    where the population is 250 000 inhabitants or fewer, with a given
    population density per km2 to be established by the Member States
  domain:
    - general
    - assessment

- id: Art4_def20
  source:
    document: directive_2024_2881
    article: 4
    point: 20
  norm_type: definition
  normative_role: definitional
  term: assessment
  definition: >
    any method used to measure, calculate, predict or estimate levels
  domain:
    - general
    - assessment

- id: Art4_def21
  source:
    document: directive_2024_2881
    article: 4
    point: 21
  norm_type: definition
  normative_role: definitional
  term: assessment_threshold
  definition: >
    the level that determines the required assessment regime to be used to
    assess ambient air quality
  domain:
    - general
    - assessment

- id: Art4_def22
  source:
    document: directive_2024_2881
    article: 4
    point: 22
  norm_type: definition
  normative_role: definitional
  term: fixed_measurements
  definition: >
    measurements taken at sampling points, either continuously or by random
    sampling, at constant locations for at least 1 calendar year to
    determine the levels in accordance with the relevant data quality
    objectives
  domain:
    - assessment
    - monitoring

- id: Art4_def23
  source:
    document: directive_2024_2881
    article: 4
    point: 23
  norm_type: definition
  normative_role: definitional
  term: indicative_measurements
  definition: >
    measurements, taken either at regular intervals during a calendar year
    or by random sampling, to determine the levels in accordance with data
    quality objectives that are less strict than those required for fixed
    measurements
  domain:
    - assessment
    - monitoring

- id: Art4_def24
  source:
    document: directive_2024_2881
    article: 4
    point: 24
  norm_type: definition
  normative_role: definitional
  term: modelling_application
  definition: >
    application of a modelling system, understood as a chain of models and
    submodels, including all necessary input data, and any post-processing
  domain:
    - assessment
    - modelling

- id: Art4_def25
  source:
    document: directive_2024_2881
    article: 4
    point: 25
  norm_type: definition
  normative_role: definitional
  term: objective_estimation
  definition: >
    information on the concentration or deposition level of a specific
    pollutant obtained through expert analysis and which can include use of
    statistical tools
  domain:
    - assessment

- id: Art4_def26
  source:
    document: directive_2024_2881
    article: 4
    point: 26
  norm_type: definition
  normative_role: definitional
  term: spatial_representativeness
  definition: >
    an assessment approach whereby the air quality metrics observed at a
    sampling point are representative for an explicitly delineated
    geographical area to the extent that air quality metrics within that
    area do not differ from the metrics observed at the sampling point by
    more than a pre-defined tolerance level
  domain:
    - assessment
    - monitoring

- id: Art4_def27
  source:
    document: directive_2024_2881
    article: 4
    point: 27
  norm_type: definition
  normative_role: definitional
  term: air_pollution_hotspots
  definition: >
    locations within a zone with the highest concentrations to which the
    population is likely to be directly or indirectly exposed for a period
    which is significant in relation to the averaging period of the limit
    values or target values, including where the pollution level is strongly
    influenced by the emissions from heavy pollution sources, such as nearby
    congested and heavily trafficked roads, a single industrial source or an
    industrial area with many sources, ports, airports, intensive
    residential heating, or a combination thereof
  domain:
    - general
    - assessment
    - monitoring

- id: Art4_def28
  source:
    document: directive_2024_2881
    article: 4
    point: 28
  norm_type: definition
  normative_role: definitional
  term: urban_background_locations
  definition: >
    places in urban and suburban areas where levels are representative of
    the exposure of the general urban population
  domain:
    - general
    - monitoring

- id: Art4_def29
  source:
    document: directive_2024_2881
    article: 4
    point: 29
  norm_type: definition
  normative_role: definitional
  term: rural_background_locations
  definition: >
    places in rural areas with low population density where levels are
    representative of the exposure of the general rural population,
    vegetation and natural ecosystems
  domain:
    - general
    - monitoring

- id: Art4_def30
  source:
    document: directive_2024_2881
    article: 4
    point: 30
  norm_type: definition
  normative_role: definitional
  term: monitoring_supersite
  definition: >
    a monitoring station at an urban background location or rural background
    location that combines multiple sampling points to gather long-term data
    on several pollutants
  domain:
    - monitoring

- id: Art4_def31
  source:
    document: directive_2024_2881
    article: 4
    point: 31
  norm_type: definition
  normative_role: definitional
  term: limit_value
  definition: >
    a level which is fixed on the basis of scientific knowledge, with the
    aim of avoiding, preventing or reducing harmful effects on human health
    or the environment, and which is to be attained within a given period
    and not to be exceeded once attained
  domain:
    - general
    - assessment

- id: Art4_def32
  source:
    document: directive_2024_2881
    article: 4
    point: 32
  norm_type: definition
  normative_role: definitional
  term: target_value
  definition: >
    a level fixed on the basis of scientific knowledge, with the aim of
    avoiding, preventing or reducing harmful effects on human health or the
    environment, to be attained where possible over a given period
  domain:
    - general
    - assessment

- id: Art4_def33
  source:
    document: directive_2024_2881
    article: 4
    point: 33
  norm_type: definition
  normative_role: definitional
  term: average_exposure_indicator
  definition: >
    an average level determined on the basis of measurements at urban
    background locations throughout the average exposure territorial unit
    or, if there is no urban area located in that territorial unit, at
    rural background locations, and which reflects population exposure,
    used to check whether the average exposure reduction obligation and the
    average exposure concentration objective for that territorial unit have
    been met
  domain:
    - general
    - assessment
    - monitoring

- id: Art4_def34
  source:
    document: directive_2024_2881
    article: 4
    point: 34
  norm_type: definition
  normative_role: definitional
  term: average_exposure_reduction_obligation
  definition: >
    a percentage reduction of the average exposure of the population,
    expressed as an average exposure indicator, of an average exposure
    territorial unit, set with the aim of reducing harmful effects on human
    health, to be attained over a given period and not to be exceeded once
    attained
  domain:
    - general
    - assessment

- id: Art4_def35
  source:
    document: directive_2024_2881
    article: 4
    point: 35
  norm_type: definition
  normative_role: definitional
  term: average_exposure_concentration_objective
  definition: >
    a level of the average exposure indicator to be attained, with the aim
    of reducing harmful effects on human health
  domain:
    - general
    - assessment

- id: Art4_def36
  source:
    document: directive_2024_2881
    article: 4
    point: 36
  norm_type: definition
  normative_role: definitional
  term: critical_level
  definition: >
    a level above which direct adverse effects can occur on some receptors,
    such as trees, other plants or natural ecosystems but not on humans
  domain:
    - general
    - assessment

- id: Art4_def37
  source:
    document: directive_2024_2881
    article: 4
    point: 37
  norm_type: definition
  normative_role: definitional
  term: alert_threshold
  definition: >
    a level beyond which there is a risk to human health from brief
    exposure for the population as a whole and at which immediate steps are
    to be taken by Member States
  domain:
    - general
    - assessment
    - planning

- id: Art4_def38
  source:
    document: directive_2024_2881
    article: 4
    point: 38
  norm_type: definition
  normative_role: definitional
  term: information_threshold
  definition: >
    a level beyond which there is a risk to human health from brief
    exposure for particularly sensitive population and vulnerable groups and
    for which immediate and appropriate information is necessary
  domain:
    - general
    - assessment
    - public_information

- id: Art4_def39
  source:
    document: directive_2024_2881
    article: 4
    point: 39
  norm_type: definition
  normative_role: definitional
  term: long_term_objective
  definition: >
    a level to be attained in the long-term, save where not achievable
    through proportionate measures, with the aim of providing effective
    protection of human health and the environment
  domain:
    - general
    - assessment

- id: Art4_def40
  source:
    document: directive_2024_2881
    article: 4
    point: 40
  norm_type: definition
  normative_role: definitional
  term: contributions_from_natural_sources
  definition: >
    emissions of pollutants not caused directly or indirectly by human
    activities, including natural events such as volcanic eruptions, seismic
    activities, geothermal activities, wild-land fires, high-wind events,
    sea sprays or the atmospheric re-suspension or transport of natural
    particles from dry regions
  domain:
    - general
    - assessment

- id: Art4_def41
  source:
    document: directive_2024_2881
    article: 4
    point: 41
  norm_type: definition
  normative_role: definitional
  term: air_quality_plan
  definition: >
    a plan that sets out policies and measures in order to comply with
    limit values, target values or average exposure reduction obligations
    once these have been exceeded
  domain:
    - general
    - planning

- id: Art4_def42
  source:
    document: directive_2024_2881
    article: 4
    point: 42
  norm_type: definition
  normative_role: definitional
  term: air_quality_roadmap
  definition: >
    an air quality plan, adopted ahead of the attainment deadline of limit
    values and target values, that sets out policies and measures in order
    to comply with those limit values and target values within the
    attainment deadline
  domain:
    - general
    - planning

- id: Art4_def43
  source:
    document: directive_2024_2881
    article: 4
    point: 43
  norm_type: definition
  normative_role: definitional
  term: short_term_action_plan
  definition: >
    a plan that sets out emergency measures to be taken in the short term
    to reduce the immediate risk or the duration of the exceedance of the
    alert thresholds
  domain:
    - general
    - planning

- id: Art4_def44
  source:
    document: directive_2024_2881
    article: 4
    point: 44
  norm_type: definition
  normative_role: definitional
  term: sensitive_population_and_vulnerable_groups
  definition: >
    those population groups that are permanently or temporarily more
    sensitive or more vulnerable to the effects of air pollution than the
    average population, because of specific characteristics that make the
    health effects of exposure more significant or because they have a
    higher sensitivity or a lower threshold for health effects or have a
    reduced ability to protect themselves
  domain:
    - general
    - public_information

- id: Art4_def45
  source:
    document: directive_2024_2881
    article: 4
    point: 45
  norm_type: definition
  normative_role: definitional
  term: the_public_concerned
  definition: >
    one or more natural or legal persons affected or likely to be affected
    by, or having an interest in, the decision-making procedures related to
    the implementation of Article 9, 19 or 20; for the purposes of this
    definition, non-governmental organisations promoting the protection of
    human health or the environment and meeting any requirements under
    national law shall be deemed to have an interest
  references:
    - article: 9
    - article: 19
    - article: 20
  domain:
    - general
    - enforcement
