# ─────────────────────────────────────────────
# ARTICLE 7 — Assessment regime
# ─────────────────────────────────────────────

- id: Art7_p1_a
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 1
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: establish
    object: applicability_of_assessment_thresholds
  references:
    - annex: II
  domain:
    - assessment
    - general

# The first subparagraph declares that the thresholds in
# Annex II "shall apply" — a constitutive rule establishing
# legal applicability, not a prescription to an actor.

- id: Art7_p1_b
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 1
  norm_type: obligation
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: classify
    object: zones
  condition:
    text: in relation to assessment thresholds
  references:
    - annex: II
  domain:
    - assessment

# "Each zone shall be classified" — the actor is member_state
# by attribution: classification is a member_state responsibility
# per Art5(a) and the general structure of the Directive.
# The provision is phrased impersonally; if strict fidelity
# requires omitting inferred actors, encode as constitutive_rule.
# Here classified as obligation following systematic reading.

- id: Art7_p2_a
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 2
  norm_type: obligation
  normative_role: procedural
  actor:
    type: member_state
  action:
    verb: review
    object: zone_classification
  timing:
    type: recurring
    interval: P5Y
    anchor: previous_classification
  references:
    - article: 7
      paragraph: 3
  domain:
    - assessment

- id: Art7_p2_b
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 2
  norm_type: obligation
  normative_role: procedural
  actor:
    type: member_state
  action:
    verb: review
    object: zone_classification
  condition:
    text: in the event of significant changes in activities impacting ambient concentrations
  domain:
    - assessment

# The "more frequently" review is a separate obligation
# with a different trigger — split per atomicity rules.

- id: Art7_p3_a
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 3
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: determine
    object: exceedances_of_assessment_thresholds
  condition:
    text: on the basis of concentrations during the previous 5 years where sufficient data are available
  domain:
    - assessment

- id: Art7_p3_b
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 3
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: classify
    object: assessment_threshold_exceedance
  condition:
    text: if exceeded during at least 3 separate years out of the previous 5 years
  domain:
    - assessment

- id: Art7_p3_c
  source:
    document: directive_2024_2881
    article: 7
    paragraph: 3
  norm_type: permission
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: determine
    object: exceedances_of_assessment_thresholds
  condition:
    text: where data are available for less than 5 years
  qualifiers:
    - where_applicable
  domain:
    - assessment

# The second subparagraph ("Member States may combine...") is
# a permission for an alternative determination method when
# data are insufficient. Encoded separately from the default rule.

