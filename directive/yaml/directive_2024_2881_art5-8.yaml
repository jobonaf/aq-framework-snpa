# Directive (EU) 2024/2881 — Articles 5, 6, 7, 8
# Annotated per Normative YAML Spec v2.1.1

# ─────────────────────────────────────────────
# ARTICLE 5 — Responsibilities
# ─────────────────────────────────────────────

- id: Art5_p1
  source:
    document: directive_2024_2881
    article: 5
  norm_type: obligation
  normative_role: institutional
  actor:
    type: member_state
  action:
    verb: designate
    object:
      - competent_authorities
      - responsible_bodies
  domain:
    - institutional

# Points (a)–(j) encode the assigned responsibilities.
# Each point is a constitutive_rule assigning competence
# to the designated competent authority/body.
# They do not prescribe a specific action to a specific
# named actor; they enumerate the scope of designation.

- id: Art5_a
