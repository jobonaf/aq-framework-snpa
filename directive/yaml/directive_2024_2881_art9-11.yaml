- id: Art9_p3
  # NOTE: Art. 9(3) establishes a single permission conditioned on four
  # cumulative requirements (a–d). The four points are conditions of the
  # same permission, not independent norms. They are therefore encoded as
  # a single unit with a composite condition text rather than split.
  # SPEC SUGGESTION: the condition field currently accepts a single text string.
  # For multi-limb conditions it would be useful to allow a list of text strings
  # (condition.items: list) to preserve the internal structure without merging.
  source:
    document: directive_2024_2881
    article: 9
    paragraph: 3
  norm_type: permission
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: reduce
    object: minimum_number_of_sampling_points_for_fixed_measurements
  condition:
    text: >
      where the level of pollutants exceeds the relevant assessment threshold
      specified in Annex II but not the respective limit values, target values
      and critical levels specified in Annex I, and provided that:
      (a) indicative measurements or modelling applications provide sufficient
      information for the assessment of air quality with regard to limit values,
      target values, critical levels, alert thresholds and information thresholds,
      as well as adequate information for the public;
      (b) the number of sampling points and the spatial resolution of indicative
      measurements and modelling applications are sufficient for concentrations
      to be established in accordance with the data quality objectives in Annex V,
      Points A and B, and enable assessment results to meet the requirements in
      Point E of Annex V;
      (c) the number of indicative measurements, if used, is at least the same as
      the number of fixed measurements being replaced and is evenly distributed
      over the calendar year;
      (d) for ozone, nitrogen dioxide is measured at all remaining ozone sampling
      points except at rural background locations
  qualifiers:
    - at_least
  references:
    - annex: I
    - annex: II
    - annex: III
    - annex: V
    - annex: IV
  domain:
    - monitoring
    - assessment


