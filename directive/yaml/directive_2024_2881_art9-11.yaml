    # "install" is not in the allowed verb list; "ensure" covers the installation
    # obligation. SPEC SUGGESTION: add "install" to the allowed verb list, as it
    # appears repeatedly in monitoring provisions and cannot be accurately rendered
    # by any existing verb without loss of legal specificity.
    object: sampling_points_for_ozone_precursor_substances
