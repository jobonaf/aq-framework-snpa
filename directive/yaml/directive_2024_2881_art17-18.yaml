      paragraph: 2
  timing:
    type: relative
    offset: P2Y
    anchor: end_of_first_postponement_period
  domain:
    - planning

- id: Art18_p2
  source:
    document: directive_2024_2881
    article: 18
    paragraph: 2
  norm_type: permission
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: postpone
    object: attainment_deadline
  condition:
    items:
      - label: a
        text: an air quality roadmap is established by 31 December 2028 that meets the requirements listed in Article 19(6), (7) and (8)
      - label: b
        text: the air quality roadmap is supplemented by information on air pollution abatement measures listed in Point B of Annex VIII and demonstrates how exceedance periods above the limit values will be kept as short as possible
      - label: c
        text: the air quality roadmap is underpinned by air quality projections showing how the limit values will be attained as soon as possible and no later than by the end of the postponed attainment deadline, taking into account reasonable and proportionate measures
      - label: d
        text: the air quality roadmap outlines how the public and vulnerable groups will be informed about the consequences of the postponement
      - label: e
        text: the air quality roadmap outlines how additional funding will be mobilised to accelerate the improvement of air quality
      - label: f
        text: the conditions laid down in Article 18(3) are fulfilled throughout the postponement period
      - label: g
        text: where a second postponement is requested, the updated air quality roadmap demonstrates that the first roadmap has been implemented or that steps have been taken towards implementation and includes an analysis showing that the original projections did not materialise
  references:
    - article: 18
      paragraph: 3
    - article: 19
      paragraph: 6
    - article: 19
      paragraph: 7
    - article: 19
      paragraph: 8
    - annex: VIII
  domain:
    - planning
    - modelling
    - public_information

