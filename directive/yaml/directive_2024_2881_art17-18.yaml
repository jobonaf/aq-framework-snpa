- id: Art18_p1_a
  source:
    document: directive_2024_2881
    article: 18
    paragraph: 1
    point: a
  norm_type: permission
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: postpone
    object: attainment_deadline_for_limit_values
  condition:
    items:
      - label: a
        text: postponement is justified by site-specific dispersion characteristics, orographic boundary conditions, adverse climatic conditions, transboundary contributions, or where the necessary reductions can only be achieved by replacing a considerable fraction of the existing domestic heating systems that are the source of pollution causing exceedances
  references:
    - annex: I
      section: 1
  timing:
    type: absolute
    date: 2040-01-01
  domain:
    - planning

- id: Art18_p1_b
  source:
    document: directive_2024_2881
    article: 18
    paragraph: 1
    point: b
  norm_type: permission
  normative_role: operational
  actor:
    type: member_state
  action:
    verb: postpone
    object: attainment_deadline_for_limit_values
  condition:
    items:
      - label: b
        text: projections demonstrate that even taking into account the expected impact of effective air pollution measures identified in the air quality roadmap, the limit values cannot be attained by the attainment deadline
  references:
    - annex: I
      section: 1
  timing:
    type: absolute
    date: 2035-01-01
  domain:
    - planning
    - modelling

- id: Art18_p1_c
