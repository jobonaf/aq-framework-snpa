# Directive (EU) 2024/2881 — Normative YAML Annotations
# Articles 1, 2, 3
# Produced according to Normative YAML Annotation Specification v2.1
#
# Changes from v2.0 spec applied here:
#   - action.verb: added `assist` and `propose`
#   - qualifiers: added `where_applicable`
#   - normative_role for assist-type obligations: `operational` (not `institutional`)

---

# ─── ARTICLE 1 — Objectives ───────────────────────────────────────────────────

# Art. 1(1): constitutive_rule — establishes the zero-pollution objective.
# No specific actor is assigned an action; the provision creates a legal aim.

- id: Art1_p1
  source:
    document: directive_2024_2881
    article: 1
    paragraph: 1
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: establish
    object: zero_pollution_objective_for_air_quality
  domain:
    - general

# Art. 1(2) sentence 1: constitutive_rule — the directive lays down the listed
# standards. Multiple objects of the same action; not split per granularity rules.

- id: Art1_p2_a
  source:
    document: directive_2024_2881
    article: 1
    paragraph: 2
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: establish
    object:
      - limit_values
      - target_values
      - average_exposure_reduction_obligations
      - average_exposure_concentration_objectives
      - critical_levels
      - alert_thresholds
      - information_thresholds
      - long_term_objectives
  references:
    - annex: I
  domain:
    - general
    - assessment

# Art. 1(2) sentence 2: obligation on the Commission to review the standards.
# Distinct action and actor from the constitutive provision above.

- id: Art1_p2_b
  source:
    document: directive_2024_2881
    article: 1
    paragraph: 2
  norm_type: obligation
  normative_role: procedural
  actor:
    type: commission
  action:
    verb: review
    object: air_quality_standards
  references:
    - article: 3
    - annex: I
  domain:
    - general
    - assessment

# Art. 1(3): purely descriptive policy aspiration — not encoded.


# ─── ARTICLE 2 — Subject matter ───────────────────────────────────────────────

# Art. 2: constitutive_rule — establishes the material scope of the directive.
# Six points all instantiate the same implicit action on the part of the directive;
# encoded as one unit per the granularity rule (same action, multiple objects).

- id: Art2
  source:
    document: directive_2024_2881
    article: 2
  norm_type: constitutive_rule
  normative_role: operational
  action:
    verb: establish
    object:
      - objectives_for_ambient_air_quality
      - common_assessment_methods_and_criteria
      - air_quality_monitoring_provisions
      - public_information_provisions
      - air_quality_maintenance_and_improvement_provisions
      - cooperation_promotion_provisions
  domain:
    - general


# ─── ARTICLE 3 — Regular review ───────────────────────────────────────────────

# Art. 3(1): three distinct normative units:
#   (a) obligation to conduct the review — absolute deadline 2030-12-31
#   (b) same obligation recurring every 5 years, or earlier if triggered
#   (c) obligation to present the report to EP and Council (distinct action)

- id: Art3_p1_a
  source:
    document: directive_2024_2881
    article: 3
    paragraph: 1
  norm_type: obligation
  normative_role: procedural
  actor:
    type: commission
  action:
    verb: review
    object: scientific_evidence_related_to_air_pollutants_and_their_effects
  references:
    - article: 1
  timing:
    type: absolute
    date: 2030-12-31
  domain:
    - general
    - assessment

- id: Art3_p1_b
  source:
    document: directive_2024_2881
    article: 3
    paragraph: 1
  norm_type: obligation
  normative_role: procedural
  actor:
    type: commission
  action:
    verb: review
    object: scientific_evidence_related_to_air_pollutants_and_their_effects
  condition:
    text: every 5 years after 31 December 2030, and more often if substantial new scientific findings point to the need for it
  references:
    - article: 1
  timing:
    type: recurring
    interval: P5Y
    anchor: 2030-12-31
  domain:
    - general
    - assessment

- id: Art3_p1_c
  source:
    document: directive_2024_2881
    article: 3
    paragraph: 1
  norm_type: obligation
  normative_role: informational
  actor:
    type: commission
  action:
    verb: provide
    object: report_with_main_findings_to_european_parliament_and_council
  timing:
    type: absolute
    date: 2030-12-31
  domain:
    - general
    - reporting

