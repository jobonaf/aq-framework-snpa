site_name: AQ Framework SNPA
site_description: Formal technical specification of the core of Directive (EU) 2024/2881
site_author: Giovanni Bonafè
use_directory_urls: true

theme:
  name: material
  language: en

nav:
  - Home: index.md
  - introduction.md
  - architecture.md

  - MODULES:
      - modules/zone.md
      - modules/assess.md
      - modules/network.md
      - modules/modelling.md
      - modules/model_qa.md
      - modules/repr.md
      - modules/limits.md
      - modules/exposure.md
      - modules/data_quality.md

  - TABLES:
      - tables/t_assess_thresholds.md
      - tables/t_alert_thresholds.md
      - tables/t_limit_values.md
      - tables/t_min_stations.md
      - tables/t_siting.md
      - tables/t_advanced_monitoring.md
      - tables/t_supersites.md
      - tables/t_data_quality.md
      - tables/t_repr_tolerance.md
      - tables/t_exposure_obligations.md
      - tables/t_natural_events.md
      - tables/t_eionet.md

  - TODO.md
  - contributing.md

plugins:
  - search
  - mermaid2
  - i18n:
      docs_structure: folder
      default_language_only: false
      languages:
        - locale: it
          default: false
          build: true
          name: Italiano
        - locale: en
          default: true
          build: true
          name: English
          
extra:
  alternate:
    - name: Italiano
      link: /en/latest/it/
      lang: it
    - name: English
      link: /en/latest/
      lang: en