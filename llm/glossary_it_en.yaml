ambient_air:
  it: aria ambiente
  en: ambient air
  definition_it: aria esterna presente nella troposfera, ad esclusione dei luoghi di lavoro ai quali il pubblico non ha accesso regolare
  definition_en: outdoor air in the troposphere, excluding workplaces to which the public does not have regular access
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(1)
air_quality_parameters:
  it: parametri di qualità dell’aria
  en: air quality standards
  definition_it: insieme di valori normativi e soglie utilizzati per la gestione e valutazione della qualità dell’aria
  definition_en: set of regulatory values and thresholds used for air quality assessment and management
  synonyms_it:
  - standard di qualità dell’aria
  synonyms_en: []
  context: Art. 4(2), M_ASSESS, M_LIMITS
pollutant:
  it: inquinante
  en: pollutant
  definition_it: qualsiasi sostanza presente nell’aria ambiente che può avere effetti nocivi sulla salute umana o sull’ambiente
  definition_en: any substance present in ambient air likely to have harmful effects on human health or the environment
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(3), M_ASSESS, M_LIMITS, M_DATA_QUALITY, T_LIMIT_VALUES
level:
  it: livello
  en: level
  definition_it: concentrazione o deposizione di un inquinante in un determinato periodo di tempo
  definition_en: concentration of a pollutant in ambient air or its deposition over a given period
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(4), M_ASSESS, M_LIMITS, M_EXPOSURE
total_deposition:
  it: deposizione totale
  en: total deposition
  definition_it: massa totale di inquinanti trasferita dall’atmosfera alle superfici in una data area e periodo
  definition_en: total mass of pollutants transferred from the atmosphere to surfaces in a given area and time
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(5), M_LIMITS, M_MOD
pm10:
  it: PM10
  en: PM10
  definition_it: materiale particolato con diametro aerodinamico ≤ 10 μm conforme alla EN 12341
  definition_en: particulate matter with aerodynamic diameter ≤ 10 μm as defined by EN 12341
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(6), M_ASSESS, M_LIMITS, M_NETWORK, T_ASSESS_THRESHOLDS
pm25:
  it: PM2,5
  en: PM2.5
  definition_it: materiale particolato con diametro aerodinamico ≤ 2,5 μm conforme alla EN 12341
  definition_en: particulate matter with aerodynamic diameter ≤ 2.5 μm as defined by EN 12341
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(7), M_ASSESS, M_LIMITS, M_NETWORK, M_EXPOSURE, T_ASSESS_THRESHOLDS
oxides_of_nitrogen:
  it: ossidi di azoto
  en: oxides of nitrogen
  definition_it: somma di NO e NO2 espressa come concentrazione di NO2
  definition_en: sum of nitrogen monoxide and nitrogen dioxide expressed as nitrogen dioxide concentration
  synonyms_it:
  - NOx
  synonyms_en:
  - NOx
  context: Art. 4(8), M_ASSESS, M_LIMITS, M_NETWORK, T_ASSESS_THRESHOLDS
polycyclic_aromatic_hydrocarbons:
  it: idrocarburi policiclici aromatici
  en: polycyclic aromatic hydrocarbons
  definition_it: composti organici con due o più anelli aromatici fusi
  definition_en: organic compounds with two or more fused aromatic rings
  synonyms_it:
  - IPA
  synonyms_en:
  - PAHs
  context: Art. 4(10), M_ASSESS, M_LIMITS, T_ASSESS_THRESHOLDS
volatile_organic_compounds:
  it: composti organici volatili
  en: volatile organic compounds
  definition_it: composti organici non metanici che contribuiscono alla formazione di ossidanti fotochimici
  definition_en: non-methane organic compounds capable of forming photochemical oxidants
  synonyms_it:
  - COV
  synonyms_en:
  - VOC
  context: Art. 4(12), M_ASSESS, M_DATA_QUALITY
ultrafine_particles:
  it: particolato ultrafine
  en: ultrafine particles
  definition_it: particelle con diametro ≤ 100 nm misurate come concentrazione numerica
  definition_en: particles with diameter ≤ 100 nm measured as particle number concentration
  synonyms_it:
  - UFP
  synonyms_en:
  - UFP
  context: Art. 4(15), M_NETWORK, M_ADVANCED_MONITORING, T_ADVANCED_MONITORING
zone:
  it: zona
  en: zone
  definition_it: parte del territorio di uno Stato membro delimitata ai fini della valutazione della qualità dell’aria
  definition_en: part of the territory of a Member State designated for air quality assessment and management
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(17), M_ZONE, M_ASSESS, M_NETWORK
assessment:
  it: valutazione
  en: assessment
  definition_it: qualsiasi metodo per misurare, calcolare, prevedere o stimare i livelli
  definition_en: any method used to measure, calculate, predict or estimate levels
  synonyms_it:
  - strumento di valutazione
  synonyms_en:
  - assessment tool
  context: Art. 4(20), M_ASSESS, M_LIMITS
assessment_threshold:
  it: soglia di valutazione
  en: assessment threshold
  definition_it: livello che determina il regime di valutazione da utilizzare
  definition_en: level that determines the required assessment regime
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(21), Art. 7, M_ASSESS, T_ASSESS_THRESHOLDS
fixed_measurements:
  it: misurazioni in siti fissi
  en: fixed measurements
  definition_it: misurazioni effettuate in punti costanti per almeno un anno civile
  definition_en: measurements taken at fixed locations for at least one calendar year
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(22), M_ASSESS, M_NETWORK
indicative_measurements:
  it: misurazioni indicative
  en: indicative measurements
  definition_it: misurazioni con requisiti di qualità meno stringenti rispetto ai siti fissi
  definition_en: measurements with less stringent data quality requirements than fixed measurements
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(23), M_ASSESS, M_NETWORK
modelling_application:
  it: applicazione di modellizzazione
  en: modelling application
  definition_it: applicazione di una catena di modelli con dati di input e post‑processing
  definition_en: application of a modelling system including models, inputs and post-processing
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(24), M_MOD, M_MODEL_QA
objective_estimation:
  it: stima obiettiva
  en: objective estimation
  definition_it: stima dei livelli basata su analisi di esperti e strumenti statistici
  definition_en: estimate of levels based on expert analysis and statistical tools
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(25), M_ASSESS
spatial_representativeness:
  it: rappresentatività spaziale
  en: spatial representativeness
  definition_it: approccio in cui una misura è rappresentativa di un'area entro una tolleranza definita; consente di associare un'area geografica a un punto di campionamento
  definition_en: approach where a measurement represents an area within a defined tolerance; allows associating a geographic area to a sampling point
  synonyms_it:
  - area di rappresentatività
  - rappresentatività
  synonyms_en:
  - representativeness area
  - representativeness
  context: Art. 4(26), M_REPR, M_NETWORK, M_LIMITS, T_REPR_TOLERANCE
monitoring_supersite:
  it: supersito di monitoraggio
  en: monitoring supersite
  definition_it: stazione avanzata che combina più punti di campionamento per più inquinanti
  definition_en: advanced monitoring station combining multiple sampling points for several pollutants
  synonyms_it:
  - supersito
  synonyms_en:
  - supersite
  context: Art. 4(30), Art. 10, M_NETWORK, T_SUPERSITES
ozone_precursors:
  it: precursori dell’ozono
  en: ozone precursor substances
  definition_it: sostanze che contribuiscono alla formazione dell’ozono troposferico
  definition_en: substances which contribute to the formation of ground-level ozone
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(13), M_ASSESS, M_LIMITS, M_DATA_QUALITY
average_exposure_territorial_unit:
  it: unità territoriale di esposizione media
  en: average exposure territorial unit
  definition_it: parte del territorio designata per la determinazione dell’indicatore di esposizione media, corrispondente a regioni NUTS 1 o NUTS 2 o loro combinazioni
  definition_en: part of the territory designated for determining the average exposure indicator, corresponding to NUTS 1 or NUTS 2 regions or combinations thereof
  synonyms_it:
  - unità di esposizione media
  synonyms_en:
  - AE territorial unit
  context: Art. 4(18), M_EXPOSURE, M_ZONE
agglomeration:
  it: agglomerato
  en: agglomeration
  definition_it: conurbazione con popolazione superiore a 250 000 abitanti o con densità definita dagli Stati membri
  definition_en: conurbation with a population in excess of 250 000 inhabitants or with a population density defined by Member States
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(19), M_ZONE, M_NETWORK
air_pollution_hotspots:
  it: punti critici di inquinamento atmosferico
  en: air pollution hotspots
  definition_it: siti all’interno di una zona con le concentrazioni più elevate a cui la popolazione è probabilmente esposta
  definition_en: locations within a zone with the highest concentrations to which the population is likely to be exposed
  synonyms_it:
  - hotspot di inquinamento
  synonyms_en:
  - pollution hotspot
  context: Art. 4(27), M_NETWORK, M_MOD, M_REPR
urban_background_site:
  it: sito di fondo urbano
  en: urban background location
  definition_it: sito urbano o suburbano rappresentativo dell’esposizione della popolazione urbana generale
  definition_en: location in urban or suburban areas representative of the exposure of the general urban population
  synonyms_it:
  - punto di fondo urbano
  - stazione di fondo urbano
  synonyms_en:
  - urban background point
  - urban background station
  context: Art. 4(28), M_NETWORK, M_EXPOSURE, T_SUPERSITES
rural_background_site:
  it: sito di fondo rurale
  en: rural background location
  definition_it: sito in area rurale a bassa densità di popolazione rappresentativo dell’esposizione della popolazione rurale, della vegetazione e degli ecosistemi
  definition_en: location in rural areas with low population density representative of exposure of the rural population, vegetation and natural ecosystems
  synonyms_it:
  - punto di fondo rurale
  - stazione di fondo rurale
  synonyms_en:
  - rural background point
  - rural background station
  context: Art. 4(29), M_NETWORK, M_EXPOSURE, T_SUPERSITES
limit_value:
  it: valore limite
  en: limit value
  definition_it: livello fissato per evitare, prevenire o ridurre effetti nocivi, da raggiungere entro un termine e da non superare
  definition_en: level fixed to avoid, prevent or reduce harmful effects, to be attained within a given period and not to be exceeded once attained
  synonyms_it:
  - LV
  synonyms_en:
  - LV
  context: Art. 4(31), M_LIMITS, T_LIMIT_VALUES
target_value:
  it: valore-obiettivo
  en: target value
  definition_it: livello fissato per evitare, prevenire o ridurre effetti nocivi, da raggiungere ove possibile entro un termine
  definition_en: level fixed to avoid, prevent or reduce harmful effects, to be attained where possible over a given period
  synonyms_it:
  - TV
  synonyms_en:
  - TV
  context: Art. 4(32), M_LIMITS, T_LIMIT_VALUES
average_exposure_indicator:
  it: indicatore di esposizione media
  en: average exposure indicator
  definition_it: livello medio basato su misurazioni in siti di fondo che riflette l’esposizione della popolazione
  definition_en: average level based on background measurements reflecting population exposure
  synonyms_it:
  - IEM
  synonyms_en:
  - AEI
  context: Art. 4(33), M_EXPOSURE, T_EXPOSURE_OBLIGATIONS
average_exposure_reduction_obligation:
  it: obbligo di riduzione dell’esposizione media
  en: average exposure reduction obligation
  definition_it: riduzione percentuale dell’esposizione media della popolazione da raggiungere entro un termine
  definition_en: percentage reduction of average population exposure to be attained over a given period
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(34), M_EXPOSURE, T_EXPOSURE_OBLIGATIONS
average_exposure_concentration_objective:
  it: obiettivo di concentrazione dell’esposizione media
  en: average exposure concentration objective
  definition_it: livello dell’indicatore di esposizione media da raggiungere per ridurre effetti nocivi sulla salute
  definition_en: level of the average exposure indicator to be attained to reduce harmful effects on health
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(35), M_EXPOSURE, T_EXPOSURE_OBLIGATIONS
critical_level:
  it: livello critico
  en: critical level
  definition_it: livello al di sopra del quale possono verificarsi effetti negativi diretti su piante ed ecosistemi
  definition_en: level above which direct adverse effects may occur on plants and ecosystems
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(36), M_LIMITS, T_LIMIT_VALUES
alert_threshold:
  it: soglia di allarme
  en: alert threshold
  definition_it: livello oltre il quale esiste un rischio per la salute umana da esposizione di breve durata
  definition_en: level beyond which there is a risk to human health from brief exposure
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(37), Art. 15, M_LIMITS, M_PUBLIC_INFORMATION, T_ALERT_THRESHOLDS
information_threshold:
  it: soglia di informazione
  en: information threshold
  definition_it: livello oltre il quale è necessario informare gruppi sensibili e vulnerabili
  definition_en: level beyond which information is required for sensitive and vulnerable groups
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(38), Art. 15, M_LIMITS, M_PUBLIC_INFORMATION, T_ALERT_THRESHOLDS
long_term_objective:
  it: obiettivo a lungo termine
  en: long-term objective
  definition_it: livello da raggiungere nel lungo periodo per proteggere salute e ambiente
  definition_en: level to be attained in the long term to protect health and the environment
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(39)
natural_source_contributions:
  it: contributi da fonti naturali
  en: contributions from natural sources
  definition_it: emissioni non causate da attività umane, incluse eruzioni vulcaniche, incendi naturali e aerosol marini
  definition_en: emissions not caused by human activities, including volcanic eruptions, natural fires and sea spray
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(40), Art. 16, M_SOURCE_ATTRIBUTION, M_LIMITS, M_EXPOSURE, T_NATURAL_EVENTS
air_quality_plan:
  it: piano per la qualità dell’aria
  en: air quality plan
  definition_it: piano che definisce politiche e misure per conformarsi ai valori normativi in caso di superamento
  definition_en: plan setting out policies and measures to comply with air quality standards after exceedances
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(41), Art. 19, M_PLANS, M_REPORTING
air_quality_roadmap:
  it: tabella di marcia per la qualità dell’aria
  en: air quality roadmap
  definition_it: piano adottato prima della scadenza per garantire il rispetto futuro dei valori normativi
  definition_en: plan adopted ahead of attainment deadlines to ensure future compliance with standards
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(42), Art. 19, M_PLANS, M_ATTAINMENT_EXTENSION, M_REPORTING
short_term_action_plan:
  it: piano d’azione a breve termine
  en: short-term action plan
  definition_it: piano che stabilisce misure di emergenza per ridurre il rischio immediato o la durata dei superamenti
  definition_en: plan setting out emergency measures to reduce immediate risk or duration of exceedances
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(43), Art. 20, M_PLANS, M_PUBLIC_INFORMATION
vulnerable_groups:
  it: categorie vulnerabili e gruppi sensibili
  en: sensitive population and vulnerable groups
  definition_it: gruppi più sensibili o vulnerabili agli effetti dell’inquinamento atmosferico
  definition_en: population groups more sensitive or vulnerable to air pollution effects
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(44), M_PUBLIC_INFORMATION, M_PLANS
public_concerned:
  it: pubblico interessato
  en: the public concerned
  definition_it: persone fisiche o giuridiche interessate o potenzialmente interessate dai processi decisionali
  definition_en: natural or legal persons affected or likely to be affected by decision-making procedures
  synonyms_it: []
  synonyms_en: []
  context: Art. 4(45), Art. 9, Art. 19, Art. 20, M_PLANS, M_PUBLIC_INFORMATION
sampling_point:
  it: punto di campionamento
  en: sampling point
  definition_it: ubicazione specifica in cui vengono prelevati campioni di aria ambiente e misurate concentrazioni di inquinanti
  definition_en: specific location where samples of ambient air are taken and pollutant concentrations are measured
  synonyms_it:
  - stazione di misura
  synonyms_en:
  - measurement site
  context: Art. 9, M_NETWORK, M_REPR, T_MIN_STATIONS, aq:AQD_SamplingPoint
assessment_regime:
  it: regime di valutazione
  en: assessment regime
  definition_it: insieme dei metodi di valutazione da applicare per determinare il rispetto dei valori normativi
  definition_en: set of assessment methods to be applied to determine compliance with regulatory values
  synonyms_it:
  - tipo di valutazione
  synonyms_en:
  - assessment type
  context: Art. 8, M_ASSESS, M_NETWORK, aq/assessmenttype
averaging_period:
  it: periodo di mediazione
  en: averaging period
  definition_it: intervallo temporale su cui è calcolato il valore medio di concentrazione di un inquinante
  definition_en: time interval over which the average pollutant concentration value is calculated
  synonyms_it:
  - metrica
  synonyms_en:
  - metric
  context: M_ASSESS, T_ASSESS_THRESHOLDS, T_LIMIT_VALUES
exceedance:
  it: superamento
  en: exceedance
  definition_it: evento in cui la concentrazione misurata o modellata di un inquinante supera un valore soglia definito dalle norme
  definition_en: event in which the measured or modelled pollutant concentration exceeds a regulatory threshold value
  synonyms_it: []
  synonyms_en: []
  context: M_ASSESS, M_LIMITS, T_ALERT_THRESHOLDS, T_NATURAL_EVENTS
representativeness_tolerance:
  it: tolleranza di rappresentatività
  en: representativeness tolerance
  definition_it: intervallo di variazione permesso nelle concentrazioni entro cui un punto di campionamento è considerato rappresentativo di un'area
  definition_en: range of allowable concentration variation within which a sampling point is considered representative of an area
  synonyms_it: []
  synonyms_en: []
  context: Art. 8, M_REPR, T_REPR_TOLERANCE
network_adequacy:
  it: adeguatezza della rete
  en: network adequacy
  definition_it: proprietà per cui una rete di monitoraggio soddisfa i requisiti normativi di numero minimo di stazioni e criteri di posizionamento
  definition_en: property where a monitoring network meets regulatory requirements for minimum number of stations and siting criteria
  synonyms_it: []
  synonyms_en: []
  context: Art. 9, M_NETWORK, REQ-NETWORK-MINIMUM_ADEQUACY, T_MIN_STATIONS, T_SITING
emission_profile:
  it: profilo emissivo
  en: emission profile
  definition_it: caratterizzazione spaziale e temporale delle sorgenti di emissione in un'area
  definition_en: spatial and temporal characterization of emission sources in an area
  synonyms_it: []
  synonyms_en: []
  context: M_ZONE, M_REPR, M_NETWORK
station_classification:
  it: tipologia di stazione
  en: station classification
  definition_it: 'categorizzazione della stazione in base alle sorgenti predominanti: background (fondo), traffic (traffico) o industrial (industriale)'
  definition_en: 'categorization of the station based on dominant emission sources: background, traffic, or industrial'
  synonyms_it: []
  synonyms_en: []
  context: Art. 9, M_NETWORK, aq/stationclassification
area_classification:
  it: tipologia di area
  en: area classification
  definition_it: 'categorizzazione geografica dell''area in cui è posizionata la stazione: urbana, suburbana, rurale'
  definition_en: 'geographic categorization of the area where the station is located: urban, suburban, or rural'
  synonyms_it: []
  synonyms_en: []
  context: M_ZONE, M_NETWORK, aq/areaclassification
observation_validity:
  it: validità dell'osservazione
  en: observation validity
  definition_it: 'codifica della qualità e validità di un''osservazione: valida, invalida, al di sotto del limite di rivelazione'
  definition_en: 'coding of the quality and validity of an observation: valid, not valid, or below detection limit'
  synonyms_it: []
  synonyms_en: []
  context: M_DATA_QUALITY, aq/observationvalidity
observation_verification:
  it: verifica dell'osservazione
  en: observation verification
  definition_it: 'stato di verifica di un''osservazione: verificata, preliminarmente verificata, non verificata'
  definition_en: 'verification status of an observation: verified, preliminarily verified, or not verified'
  synonyms_it: []
  synonyms_en: []
  context: M_DATA_QUALITY, aq/observationverification
adjustment_type:
  it: tipo di aggiustamento
  en: adjustment type
  definition_it: 'natura dell''aggiustamento dei dati di superamento: correzione da fonti naturali, correzione per spargimento/salatura invernale, nessuna correzione applicabile'
  definition_en: 'nature of exceedance data adjustment: natural source correction, winter-sanding/salting correction, or no adjustment applicable'
  synonyms_it: []
  synonyms_en: []
  context: M_LIMITS, T_NATURAL_EVENTS, aq/adjustmenttype
compliance:
  it: conformità
  en: compliance
  definition_it: stato di adempimento di un'area alle soglie e ai valori normativi della Direttiva per tutti gli inquinanti e le metriche applicabili
  definition_en: status of an area meeting the thresholds and regulatory values of the Directive for all applicable pollutants and metrics
  synonyms_it: []
  synonyms_en: []
  context: M_LIMITS, M_REPORTING, T_LIMIT_VALUES
station:
  it: stazione
  en: station
  definition_it: ubicazione fisica che ospita uno o più punti di campionamento e strumenti di misura per il monitoraggio della qualità dell'aria
  definition_en: physical location hosting one or more sampling points and measurement instruments for air quality monitoring
  synonyms_it:
  - stazione di monitoraggio
  synonyms_en:
  - monitoring station
  context: Art. 9, M_NETWORK, M_REPR, aqd:AQD_Station
model_quality_indicator:
  it: indicatore di qualità del modello
  en: model quality indicator
  definition_it: 'indicatore MQI definito come rapporto tra l''errore di modellizzazione e l''incertezza complessiva; soglia di conformità: MQI ≤ 1'
  definition_en: 'indicator MQI defined as the ratio of modelling error to overall uncertainty; compliance threshold: MQI ≤ 1'
  synonyms_it:
  - MQI
  synonyms_en:
  - MQI
  context: Annex V, M_MODEL_QA
model_validation:
  it: validazione del modello
  en: model validation
  definition_it: processo di verifica che un modello soddisfa i criteri di qualità normativi mediante confronto tra risultati modellistici e osservazioni indipendenti
  definition_en: process of verifying that a model meets regulatory quality criteria by comparing modelling results with independent observations
  synonyms_it: []
  synonyms_en: []
  context: Art. 11, Annex V, Annex VI, M_MODEL_QA, M_MOD
concentration_field:
  it: campo di concentrazione
  en: concentration field
  definition_it: rappresentazione spaziale continua delle concentrazioni di inquinanti ottenuta mediante applicazione di modellistica
  definition_en: continuous spatial representation of pollutant concentrations obtained through modelling application
  synonyms_it: []
  synonyms_en: []
  context: M_MOD, M_REPR, M_LIMITS
exceedance_area:
  it: area di superamento
  en: exceedance area
  definition_it: area geografica dove il campo di concentrazione modellato supera una soglia normativa per un inquinante e periodo specifici
  definition_en: geographic area where the modelled concentration field exceeds a regulatory threshold for a specific pollutant and period
  synonyms_it: []
  synonyms_en: []
  context: M_MOD, M_REPR, M_LIMITS, M_SOURCE_ATTRIBUTION
model_type:
  it: tipo di modello
  en: model type
  definition_it: categoria di applicazione di modellizzazione utilizzata per la valutazione della qualità dell'aria (es. CTM, Gaussian plume, statistical)
  definition_en: category of modelling application used for air quality assessment (e.g., CTM, Gaussian plume, statistical)
  synonyms_it: []
  synonyms_en: []
  context: M_MOD, M_MODEL_QA, aq/modeltype
measurement_uncertainty:
  it: incertezza della misura
  en: measurement uncertainty
  definition_it: stima dell'intervallo attorno a una concentrazione misurata entro il quale è ragionevole attendersi il valore vero
  definition_en: estimate of the interval around a measured concentration within which the true value is reasonably expected to lie
  synonyms_it: []
  synonyms_en: []
  context: M_MODEL_QA, M_DATA_QUALITY, Annex V
model_uncertainty:
  it: incertezza della modellizzazione
  en: model uncertainty
  definition_it: stima dell'intervallo di variazione attorno a una concentrazione modellata associato alle limitazioni della catena di modelli
  definition_en: estimate of the range of variation around a modelled concentration associated with limitations of the modelling system
  synonyms_it: []
  synonyms_en: []
  context: M_MODEL_QA, REQ-MODELQA-MQI_DEFINITION, Annex V
hotspot_location:
  it: sito critico
  en: hotspot location
  definition_it: ubicazione all'interno di una zona con concentrazioni probabilmente elevate a cui la popolazione è probabile sia esposta
  definition_en: location within a zone with the highest concentrations to which the population is likely to be exposed
  synonyms_it:
  - hotspot
  synonyms_en:
  - hotspot
  context: M_NETWORK, M_MOD, Art. 4(27)
representative_location:
  it: sito rappresentativo
  en: representative location
  definition_it: ubicazione entro una zona dove i livelli sono rappresentativi dell'area secondo i criteri di rappresentatività spaziale definiti nel modulo REPR
  definition_en: location within a zone where levels are representative of the area according to spatial representativeness criteria
  synonyms_it:
  - punto rappresentativo
  - stazione rappresentativa
  synonyms_en:
  - representative site
  - representative station
  context: M_NETWORK, M_REPR, M_ASSESS, T_MIN_STATIONS, T_ALERT_THRESHOLDS
data_coverage:
  it: copertura dati
  en: data coverage
  definition_it: percentuale di dati validi disponibili per una stazione di monitoraggio in un periodo determinato
  definition_en: percentage of valid data available for a monitoring station over a specified period
  synonyms_it:
  - completezza dati
  - disponibilità dati
  synonyms_en:
  - data completeness
  - data availability
  context: M_DATA_QUALITY, T_DATA_QUALITY, REQ-DATAQUALITY-COVERAGE
data_completeness:
  it: completezza dei dati
  en: data completeness
  definition_it: misura di quanti dati validi sono stati raccolti rispetto al totale atteso per una stazione o zona
  definition_en: measure of valid data collected compared to the total expected for a station or zone
  synonyms_it:
  - completezza
  - percentuale di completezza
  synonyms_en:
  - completeness
  - completeness percentage
  context: M_DATA_QUALITY, T_DATA_QUALITY, Art. 6(4)
active_sampling_site:
  it: sito di campionamento attivo
  en: active sampling site
  definition_it: punto di monitoraggio dove vengono effettuate misurazioni tramite prelevamento artificiale dell'aria (es. pompe ad aria)
  definition_en: monitoring point where measurements are performed through artificial air sampling (e.g., air pumps)
  synonyms_it:
  - punto di campionamento attivo
  synonyms_en:
  - active sampling point
  context: M_NETWORK, M_DATA_QUALITY, T_SUPERSITES
zone_population:
  it: popolazione della zona
  en: zone population
  definition_it: numero di persone residenti nella zona per cui è effettuata la valutazione della qualità dell'aria
  definition_en: number of residents in the zone for which air quality assessment is performed
  synonyms_it:
  - popolazione
  synonyms_en:
  - population
  context: M_ZONE, M_EXPOSURE, M_ASSESS, T_SITING, T_LIMIT_VALUES
air_quality_standards:
  it: standard di qualità dell’aria
  en: air quality standards
  definition_it: insieme dei valori limite, valori-obiettivo, obblighi di riduzione dell’esposizione media, obiettivi di concentrazione dell’esposizione media, livelli critici, soglie di allarme, soglie di informazione e obiettivi a lungo termine
  definition_en: limit values, target values, average exposure reduction obligations, average exposure concentration objectives, critical levels, alert thresholds, information thresholds and long-term objectives
  synonyms_it:
  - parametri di qualità dell’aria
  synonyms_en: []
  context: Art. 4(2), M_ASSESS, M_LIMITS, M_EXPOSURE
source_attribution:
  it: attribuzione delle fonti
  en: source attribution
  definition_it: processo di identificazione e documentazione delle fonti o categorie di fonti che contribuiscono a un livello, superamento o indicatore di esposizione
  definition_en: process of identifying and documenting the sources or source categories contributing to a level, exceedance or exposure indicator
  synonyms_it:
  - attribuzione sorgenti
  synonyms_en:
  - source apportionment
  context: M_SOURCE_ATTRIBUTION, M_LIMITS, M_EXPOSURE, M_PLANS
source_contribution:
  it: contributo di fonte
  en: source contribution
  definition_it: quota stimata del livello di un inquinante attribuibile a una specifica fonte o categoria di fonti
  definition_en: estimated share of a pollutant level attributable to a specific source or source category
  synonyms_it:
  - contributo della sorgente
  synonyms_en:
  - source contribution estimate
  context: M_SOURCE_ATTRIBUTION, M_MOD, M_TRANSBOUNDARY
attribution_evidence_package:
  it: pacchetto di evidenze per l’attribuzione
  en: attribution evidence package
  definition_it: insieme tracciabile di dati, metodi, misure, modellistica e documentazione utilizzato per sostenere una conclusione di attribuzione
  definition_en: traceable set of data, methods, measurements, modelling and documentation used to support an attribution conclusion
  synonyms_it:
  - pacchetto probatorio di attribuzione
  synonyms_en:
  - source attribution evidence package
  context: M_SOURCE_ATTRIBUTION, M_REPORTING
natural_source_case:
  it: caso di fonte naturale
  en: natural-source case
  definition_it: caso in cui un superamento o un livello è attribuito, in tutto o in parte, a contributi da fonti naturali
  definition_en: case where an exceedance or level is attributed wholly or partly to contributions from natural sources
  synonyms_it:
  - caso da fonti naturali
  synonyms_en:
  - natural source case
  context: Art. 16, M_SOURCE_ATTRIBUTION, M_LIMITS, M_EXPOSURE
winter_sanding_salting_case:
  it: caso di sabbiatura o salatura invernale
  en: winter sanding or salting case
  definition_it: caso di superamento del PM10 attribuibile alla risospensione di particolato dovuta a sabbiatura o salatura invernale delle strade
  definition_en: PM10 exceedance case attributable to re-suspension of particulates following winter sanding or salting of roads
  synonyms_it:
  - caso di spargimento o salatura invernale
  synonyms_en:
  - winter sanding/salting case
  context: Art. 17, M_SOURCE_ATTRIBUTION, M_LIMITS, M_PLANS
transboundary_case:
  it: caso transfrontaliero
  en: transboundary case
  definition_it: caso in cui il trasporto transfrontaliero di inquinamento atmosferico contribuisce in modo significativo a livelli o superamenti in un altro territorio
  definition_en: case where transboundary transport of air pollution contributes significantly to levels or exceedances in another territory
  synonyms_it:
  - caso di inquinamento transfrontaliero
  synonyms_en:
  - transboundary pollution case
  context: Art. 21, M_TRANSBOUNDARY, M_SOURCE_ATTRIBUTION, M_ATTAINMENT_EXTENSION
affected_state:
  it: Stato interessato
  en: affected State
  definition_it: Stato membro o territorio in cui si manifesta un superamento o impatto di qualità dell’aria associato anche a contributi esterni
  definition_en: Member State or territory where an air quality exceedance or impact occurs, including where external contributions are relevant
  synonyms_it:
  - Stato membro interessato
  synonyms_en:
  - affected Member State
  context: M_TRANSBOUNDARY, M_REPORTING
source_state:
  it: Stato di origine
  en: source State
  definition_it: Stato membro o paese terzo da cui proviene un contributo transfrontaliero di inquinamento atmosferico
  definition_en: Member State or third country from which a transboundary air pollution contribution originates
  synonyms_it:
  - Stato fonte
  synonyms_en:
  - source Member State
  context: M_TRANSBOUNDARY, M_SOURCE_ATTRIBUTION
attainment_extension:
  it: proroga del termine di conseguimento
  en: attainment extension
  definition_it: posticipo condizionato del termine per il conseguimento di un valore limite, valutato sulla base delle condizioni previste dalla direttiva
  definition_en: conditional postponement of the deadline for attaining a limit value, assessed against the conditions set by the Directive
  synonyms_it:
  - posticipo del termine di conseguimento
  synonyms_en:
  - postponement of attainment deadline
  context: Art. 18, M_ATTAINMENT_EXTENSION, M_PLANS, M_REPORTING
postponement_request:
  it: richiesta di proroga
  en: postponement request
  definition_it: richiesta documentata di posticipare il termine di conseguimento applicabile a un valore limite
  definition_en: documented request to postpone the attainment deadline applicable to a limit value
  synonyms_it:
  - richiesta di posticipo
  synonyms_en:
  - attainment deadline postponement request
  context: Art. 18, M_ATTAINMENT_EXTENSION, M_REPORTING
projected_attainment_date:
  it: data prevista di conseguimento
  en: projected attainment date
  definition_it: data futura stimata in cui si prevede il conseguimento del valore normativo sulla base di proiezioni e misure previste
  definition_en: future date when attainment of the regulatory value is expected based on projections and planned measures
  synonyms_it:
  - data di conseguimento prevista
  synonyms_en:
  - expected attainment date
  context: M_MOD, M_PLANS, M_ATTAINMENT_EXTENSION
plan_status:
  it: stato del piano
  en: plan status
  definition_it: output che indica se un piano è richiesto, esistente, valido, da aggiornare o supportato da evidenze sufficienti
  definition_en: output indicating whether a plan is required, exists, is valid, needs update or is supported by sufficient evidence
  synonyms_it: []
  synonyms_en: []
  context: M_PLANS, M_REPORTING
reporting_package:
  it: pacchetto di rendicontazione
  en: reporting package
  definition_it: insieme strutturato di dati, metadati ed evidenze predisposto per la rendicontazione regolatoria
  definition_en: structured set of data, metadata and evidence prepared for regulatory reporting
  synonyms_it:
  - pacchetto di reporting
  synonyms_en:
  - regulatory reporting package
  context: Art. 23, M_REPORTING
public_information:
  it: informazione al pubblico
  en: public information
  definition_it: informazione sulla qualità dell’aria comunicata al pubblico in forma tempestiva, chiara, accessibile e tracciabile
  definition_en: air quality information communicated to the public in a timely, clear, accessible and traceable form
  synonyms_it:
  - comunicazione al pubblico
  synonyms_en:
  - public communication
  context: Art. 22, M_PUBLIC_INFORMATION
legal_effect_boundary:
  it: confine dell’effetto giuridico
  en: legal-effect boundary
  definition_it: delimitazione tra output computabile o probatorio del framework e decisione giuridica o istituzionale finale
  definition_en: boundary between a computable or evidentiary framework output and the final legal or institutional decision
  synonyms_it:
  - confine giuridico
  synonyms_en:
  - legal boundary
  context: M_SOURCE_ATTRIBUTION, M_ATTAINMENT_EXTENSION, M_REPORTING, architecture
purpose_specific_validation:
  it: validazione specifica per scopo
  en: purpose-specific validation
  definition_it: principio secondo cui dati, modelli o aree di rappresentatività sono validi solo rispetto a uno specifico uso regolatorio
  definition_en: principle whereby data, models or representativeness areas are valid only for a specific regulatory use
  synonyms_it:
  - validità specifica per scopo
  synonyms_en:
  - purpose-specific validity
  context: M_DATA_QUALITY, M_MODEL_QA, M_REPR, architecture
modelled_exceedance_area:
  it: area modellata di superamento
  en: modelled exceedance area
  definition_it: area geografica in cui una applicazione di modellizzazione indica il superamento di un valore o soglia normativa
  definition_en: geographic area where a modelling application indicates exceedance of a regulatory value or threshold
  synonyms_it:
  - area di superamento modellata
  synonyms_en:
  - modelled exceedance zone
  context: Art. 8, M_MOD, M_REPR, M_ASSESS, M_LIMITS
uncovered_modelled_exceedance_area:
  it: area modellata di superamento non coperta
  en: uncovered modelled exceedance area
  definition_it: porzione di area modellata di superamento non coperta da misurazioni fisse e dalle rispettive aree di rappresentatività spaziale
  definition_en: portion of a modelled exceedance area not covered by fixed measurements and their spatial representativeness areas
  synonyms_it:
  - area di superamento non coperta
  synonyms_en:
  - uncovered exceedance area
  context: Art. 8(6), M_REPR, M_NETWORK, M_ASSESS
network_reduction:
  it: riduzione della rete
  en: network reduction
  definition_it: riduzione condizionata del numero minimo di punti di campionamento fissi sulla base delle condizioni normative applicabili
  definition_en: conditional reduction of the minimum number of fixed sampling points based on applicable regulatory conditions
  synonyms_it:
  - riduzione dei punti fissi
  synonyms_en:
  - reduction of fixed measurement points
  context: Art. 9(3), M_NETWORK, M_ASSESS, M_MOD, M_REPR
relocation_support:
  it: supporto alla rilocalizzazione
  en: relocation support
  definition_it: insieme di evidenze, incluse modellistica o misurazioni indicative, utilizzato per giustificare la rilocalizzazione di un punto di campionamento
  definition_en: set of evidence, including modelling or indicative measurements, used to justify relocation of a sampling point
  synonyms_it:
  - supporto allo spostamento
  synonyms_en:
  - sampling point relocation support
  context: Art. 9(7), M_NETWORK, M_REPR, M_MOD
additional_measurement:
  it: misurazione aggiuntiva
  en: additional measurement
  definition_it: misurazione fissa o indicativa istituita o utilizzata per coprire o valutare un’area di superamento modellata non coperta
  definition_en: fixed or indicative measurement established or used to cover or assess an uncovered modelled exceedance area
  synonyms_it:
  - misura aggiuntiva
  synonyms_en:
  - additional fixed or indicative measurement
  context: Art. 8(6), Art. 9(3), M_NETWORK, M_ASSESS, M_DATA_QUALITY
forecast:
  it: previsione
  en: forecast
  definition_it: stima modellistica o previsiva di livelli futuri a breve termine, utilizzata in particolare per soglie di allarme o informazione
  definition_en: modelled or predictive estimate of short-term future levels, used in particular for alert or information thresholds
  synonyms_it:
  - previsione a breve termine
  synonyms_en:
  - short-term forecast
  context: Art. 15, Art. 20, M_MOD, M_PUBLIC_INFORMATION
projection:
  it: proiezione
  en: projection
  definition_it: stima modellistica di livelli futuri basata su scenari, misure, emissioni o altre ipotesi documentate
  definition_en: modelled estimate of future levels based on scenarios, measures, emissions or other documented assumptions
  synonyms_it:
  - scenario previsionale
  synonyms_en:
  - scenario projection
  context: Art. 18, Art. 19, M_MOD, M_PLANS, M_ATTAINMENT_EXTENSION
